# FineBioStreaming default config
task: streaming_halt
architecture: vlm_llava_next_video
data_version: streaming_v2

data:
  frames_per_chunk: 8
  steps_per_chunk: 2
  window_sec: 20
  synth_per_trial: 3
  halt_repeat: 3
  val_frac: 0.1

model:
  model_path: lmms-lab/LLaVA-NeXT-Video-7B-DPO
  num_frames: 8
  pool_stride: 2
  lora_r: 64
  lora_alpha: 128
  n_halt: 5

loss:
  lambda_halt: 1.0
  lambda_step: 0.3

train:
  epochs: 3
  gpus: 4
  batch_size: 1
  grad_accum: 2
  lr: 1.0e-4
  num_workers: 4
  save_every: 100

infer:
  halt_threshold: 0.45
  decision: lm
  history_in_prompt: true
